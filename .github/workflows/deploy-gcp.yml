# Deploy to Google Cloud Run. Run manually from the Actions tab.
# One-time setup (project, Artifact Registry, Cloud SQL, secrets, Workload
# Identity Federation) is in docs/DEPLOY.md.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID, GCP_REGION, GCP_SERVICE_ACCOUNT (deployer), GCP_RUNTIME_SA,
#   GCP_WIF_PROVIDER, CLOUDSQL_INSTANCE, CORS_ORIGINS
name: Deploy to GCP (Cloud Run)

on:
  workflow_dispatch:

env:
  SERVICE: market-backend
  REPO: market-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless auth via Workload Identity Federation
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_INSTANCE }}" \
            --set-secrets "DATABASE_URL=database-url:latest,ALPHAVANTAGE_API_KEY=alphavantage-api-key:latest,INGEST_TOKEN=ingest-token:latest" \
            --set-env-vars "^|^CORS_ORIGINS=${{ vars.CORS_ORIGINS }}" \
            --min-instances 0 \
            --max-instances 2

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$URL/health/ready"
