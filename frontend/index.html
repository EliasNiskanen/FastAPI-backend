<!doctype html>
<html lang="en" data-mode="all" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E1F22" />
    <meta
      name="description"
      content="BullBearScope: search US stocks and crypto, see today's biggest moves, and compare prices on interactive charts."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BullBearScope: stocks and crypto</title>
    <script>
      // Set the market mode and colour theme before the first paint, so the
      // page never flashes in the wrong colours. Mirrors src/lib/prefs.ts.
      ;(function () {
        var root = document.documentElement
        var mode = new URLSearchParams(location.search).get('m')
        root.dataset.mode = mode === 'crypto' || mode === 'stock' ? mode : 'all'
        var theme = null
        try {
          theme = localStorage.getItem('bullbearscope.theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        root.dataset.theme = theme
      })()
    </script>
    <!-- Runtime settings (API address). Generated by the container at startup. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
