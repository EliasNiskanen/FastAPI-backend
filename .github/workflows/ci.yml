name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stocks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stocks
      # Enables the concurrency test that needs real PostgreSQL.
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stocks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pytest -q
      - name: Migrations apply cleanly to real PostgreSQL
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fastapi-backend:ci .
      - run: docker build -t market-frontend:ci frontend
      - name: Frontend image serves the app and its runtime config
        run: |
          docker run -d --name web -p 8080:8080 -e API_URL=https://api.example.test market-frontend:ci
          sleep 2
          curl -fsS localhost:8080/config.js | grep -q 'apiUrl: "https://api.example.test"'
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          curl -fsS localhost:8080/some/deep/link | grep -q '<div id="root">'
          docker logs web
