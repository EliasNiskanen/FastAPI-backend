[project]
name = "fastapi-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Elias Niskanen"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "tzdata (>=2026.5,<2027.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
